name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y restic jq python3 rsync nodejs curl ca-certificates gnupg shellcheck
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y gum
      - name: Compile Python
        run: python3 -m py_compile scripts/*.py
      - name: Shellcheck (errors only)
        run: |
          shellcheck --severity=error scripts/omaclone scripts/cmd-*.sh scripts/lib.sh scripts/restore \
            scripts/deps.sh scripts/backend.sh scripts/tui.sh scripts/nfs-lib.sh scripts/transport-lib.sh \
            scripts/locations.sh scripts/install-disk-mount.sh scripts/launch-tui.sh
      - name: Plugin validate (when omarchy is installed)
        run: |
          if command -v omarchy >/dev/null 2>&1; then
            omarchy plugin validate .
          else
            echo "SKIP omarchy plugin validate (omarchy not on PATH in this runner)"
          fi
      - name: Pull MinIO
        run: docker pull minio/minio:latest
      - name: Run tests
        env:
          OMACLONE_REQUIRE_S3: "1"
        run: ./tests/run.sh
